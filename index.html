<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>投满分·智能新闻分类引擎 | AI文本分析</title>
    <!-- 引入Google Fonts & Font Awesome 6 (免费图标库) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(5, 15, 25, 1) 0%, rgba(0, 5, 15, 1) 100%);
            min-height: 100vh;
            color: #f0f3fa;
            position: relative;
            overflow-x: hidden;
            backdrop-filter: blur(0px);
        }

        /* 动态粒子背景 (炫酷光晕效果) */
        .orb-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite alternate ease-in-out;
        }
        .orb1 { width: 50vw; height: 50vw; background: #4a00e0; top: -20vh; left: -20vw; animation-duration: 25s; }
        .orb2 { width: 60vh; height: 60vh; background: #8e2de2; bottom: -30vh; right: -10vw; animation-duration: 30s; opacity: 0.3; }
        .orb3 { width: 40vw; height: 40vw; background: #00c9ff; top: 40%; right: -20%; opacity: 0.2; animation-duration: 18s; filter: blur(100px);}
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.1); }
        }

        /* 主容器 */
        .glass-container {
            position: relative;
            z-index: 2;
            max-width: 860px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 核心卡片 - 玻璃拟态 */
        .hero-card {
            background: rgba(15, 25, 45, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), 0 0 0 0.5px rgba(255, 255, 255, 0.1) inset;
            padding: 2rem 2rem 2.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hero-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 55px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        }

        /* 标题区域 */
        .title-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        .title-section h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF, #c084fc, #60a5fa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .title-section h1 i {
            background: none;
            color: #fbbf24;
            font-size: 2.2rem;
            text-shadow: 0 0 8px rgba(251,191,36,0.5);
        }
        .sub {
            text-align: center;
            margin-top: 0.8rem;
            color: #b9c7d9;
            font-weight: 400;
            letter-spacing: 0.3px;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            display: inline-block;
            padding-bottom: 0.3rem;
            width: auto;
        }
        .badge {
            background: rgba(96, 165, 250, 0.2);
            border-radius: 40px;
            padding: 0.2rem 1rem;
            font-size: 0.8rem;
            display: inline-block;
            backdrop-filter: blur(4px);
            margin-top: 1rem;
            border: 1px solid rgba(96,165,250,0.4);
        }

        /* 输入区域 */
        .input-group {
            margin: 2rem 0 1.8rem;
        }
        .input-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            margin-bottom: 0.8rem;
            font-size: 1rem;
            letter-spacing: 0.3px;
        }
        .input-label i {
            color: #60a5fa;
            font-size: 1.2rem;
        }
        .custom-textarea {
            width: 100%;
            background: rgba(5, 12, 22, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 1rem 1.5rem;
            font-family: 'Inter', monospace;
            font-size: 1rem;
            color: #f0f3fa;
            resize: vertical;
            transition: all 0.25s ease;
            outline: none;
            font-weight: 400;
            line-height: 1.5;
        }
        .custom-textarea:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.3);
            background: rgba(5, 12, 22, 0.9);
        }
        .custom-textarea::placeholder {
            color: #7b8ba3;
            font-weight: 300;
        }
        .char-counter {
            text-align: right;
            font-size: 0.7rem;
            margin-top: 0.4rem;
            color: #8a9bb5;
        }

        /* 按钮区域 */
        .action-btn {
            display: flex;
            justify-content: center;
            margin: 1.5rem 0 1rem;
        }
        .predict-button {
            background: linear-gradient(95deg, #4f46e5, #9333ea);
            border: none;
            padding: 0.9rem 2.2rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .predict-button i {
            font-size: 1.2rem;
            transition: transform 0.2s;
        }
        .predict-button:hover {
            transform: scale(1.02);
            background: linear-gradient(95deg, #6366f1, #a855f7);
            box-shadow: 0 10px 28px rgba(139, 92, 246, 0.5);
        }
        .predict-button:active {
            transform: scale(0.98);
        }
        .predict-button:disabled {
            opacity: 0.6;
            transform: scale(0.98);
            cursor: not-allowed;
            filter: grayscale(0.1);
        }

        /* 结果展示区 - 炫酷卡片 */
        .result-section {
            margin-top: 2rem;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 2rem;
            padding: 1.2rem 1.5rem;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .result-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1rem;
            font-weight: 600;
            font-size: 1rem;
            color: #cbd5e6;
            border-left: 3px solid #c084fc;
            padding-left: 12px;
        }
        .result-header i {
            font-size: 1.3rem;
            color: #e879f9;
        }
        .prediction-value {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(125deg, #f0f9ff, #d9c6ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            word-break: break-word;
            letter-spacing: -0.3px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .loading-spinner {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
            color: #b9c7d9;
        }
        .spinner-icon {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(168,85,247,0.3);
            border-top: 3px solid #c084fc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            color: #f87171;
            background: rgba(248,113,113,0.1);
            padding: 0.8rem 1rem;
            border-radius: 1.5rem;
            font-size: 0.9rem;
            border-left: 3px solid #f87171;
        }
        .example-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 1.5rem;
            justify-content: center;
        }
        .example-chip {
            background: rgba(255,255,255,0.05);
            border-radius: 40px;
            padding: 0.4rem 1rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #cdd9f4;
        }
        .example-chip:hover {
            background: rgba(139, 92, 246, 0.3);
            border-color: #a855f7;
            color: white;
            transform: translateY(-2px);
        }
        .footer-note {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.7rem;
            color: #6c7f9e;
        }
        @media (max-width: 600px) {
            .glass-container { padding: 1rem; }
            .hero-card { padding: 1.5rem; }
            .title-section h1 { font-size: 1.9rem; }
            .prediction-value { font-size: 1.6rem; }
        }
        /* 结果入场动画 */
        .fade-up {
            animation: fadeUp 0.4s ease-out forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        i.fa, i.far, i.fas {
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="orb-bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
</div>

<div class="glass-container">
    <div class="hero-card">
        <div class="title-section">
            <h1>
                <i class="fas fa-star-of-life"></i> 
                投满分分类引擎
                <i class="fas fa-brain"></i>
            </h1>
            <div class="sub">
                <span>⚡ 新闻文本多分类 | 深度学习驱动</span>
            </div>
            <div class="badge">
                <i class="fas fa-microchip"></i> AI 精准预测 · 毫秒级响应
            </div>
        </div>

        <div class="input-group">
            <div class="input-label">
                <i class="fas fa-pen-fancy"></i> 
                <span>输入新闻文本内容</span>
            </div>
            <textarea id="newsText" class="custom-textarea" rows="5" placeholder="例如：国家航天局宣布新一代载人飞船试验成功，标志着我国深空探索迈入新阶段..."></textarea>
            <div class="char-counter">
                <span id="charCount">0</span> 字符 · 建议10字以上
            </div>
        </div>

        <div class="action-btn">
            <button id="predictBtn" class="predict-button">
                <i class="fas fa-robot"></i> 智能分类预测
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>

        <!-- 快捷示例区域 -->
        <div class="example-buttons">
            <span class="example-chip" data-text="特斯拉宣布新电池技术突破，续航提升30%，股价盘后大涨5%。"><i class="fas fa-bolt"></i> 科技财经</span>
            <span class="example-chip" data-text="巴黎奥运会闭幕式精彩回顾，中国代表团创境外最佳战绩。"><i class="fas fa-medal"></i> 体育新闻</span>
            <span class="example-chip" data-text="国务院发布促进民营经济发展壮大意见，加大融资支持力度。"><i class="fas fa-chart-line"></i> 政策经济</span>
            <span class="example-chip" data-text="AI绘画著作权第一案宣判：法院认定AI生成图片具有独创性受保护。"><i class="fas fa-gavel"></i> 法律科技</span>
        </div>

        <!-- 动态结果面板 -->
        <div class="result-section" id="resultPanel">
            <div class="result-header">
                <i class="fas fa-chart-simple"></i>
                <span>分类预测结果</span>
            </div>
            <div id="resultContent">
                <div style="display: flex; align-items: center; gap: 10px; opacity: 0.7;">
                    <i class="fas fa-hourglass-half"></i> <span>等待输入文本，点击按钮开始分析...</span>
                </div>
            </div>
        </div>
        <div class="footer-note">
            <i class="fas fa-shield-alt"></i> 基于先进多分类模型 · 数据安全加密传输
        </div>
    </div>
</div>

<script>
    // ---------- 配置后端API地址（请根据实际部署修改）----------
    // 默认本地Flask服务端口5000，若部署在其它地址请修改
    const API_URL = 'http://localhost:5000/predict';
    // 是否开启mock模式（当后端无法连接时自动降级为前端演示，仅为展示效果，不影响正式集成）
    // 注：为保证真实预测功能，默认不开启mock；但若想离线测试视觉效果可设为true，但分类结果随机。
    const USE_MOCK_FALLBACK = false;   // 生产环境务必保持false，并确保后端正常
    
    // DOM 元素
    const textarea = document.getElementById('newsText');
    const predictBtn = document.getElementById('predictBtn');
    const resultContentDiv = document.getElementById('resultContent');
    const charCountSpan = document.getElementById('charCount');
    
    // 实时更新字符计数
    function updateCharCount() {
        const len = textarea.value.length;
        charCountSpan.innerText = len;
    }
    textarea.addEventListener('input', updateCharCount);
    updateCharCount();
    
    // 展示加载状态
    function showLoading() {
        resultContentDiv.innerHTML = `
            <div class="loading-spinner">
                <div class="spinner-icon"></div>
                <span>AI 模型推理中，请稍候...</span>
            </div>
        `;
        predictBtn.disabled = true;
        predictBtn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> 预测中...`;
    }
    
    // 展示结果 (pred_class)
    function showResult(predClass) {
        resultContentDiv.innerHTML = `
            <div class="fade-up">
                <div class="prediction-value">
                    <i class="fas fa-tag" style="font-size: 1.4rem;"></i> ${escapeHtml(predClass)}
                </div>
                <div style="margin-top: 12px; font-size: 0.8rem; color: #9bb3d0;">
                    <i class="fas fa-check-circle" style="color: #4ade80;"></i> 置信度 · 高精度分类结果
                </div>
            </div>
        `;
    }
    
    // 展示错误信息
    function showError(errorMsg) {
        resultContentDiv.innerHTML = `
            <div class="error-message fade-up">
                <i class="fas fa-exclamation-triangle"></i> 错误：${escapeHtml(errorMsg)}
                <div style="font-size:0.7rem; margin-top:6px;">请检查后端服务是否正常启动，或联系管理员</div>
            </div>
        `;
    }
    
    // 简单的防XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // mock 预测 (仅用作后备演示，模拟分类结果)
    function mockPredict(text) {
        return new Promise((resolve) => {
            setTimeout(() => {
                const mockCategories = [
                    "🏷️ 科技 / 互联网", "📈 财经 / 商业", "⚽ 体育 / 竞技", 
                    "🎬 娱乐 / 文化", "🌍 国际 / 政治", "🏥 健康 / 医疗",
                    "🚀 航天 / 探索", "⚖️ 法律 / 法规"
                ];
                // 简单哈希决定分类
                let hash = 0;
                for (let i = 0; i < text.length; i++) {
                    hash = ((hash << 5) - hash) + text.charCodeAt(i);
                    hash |= 0;
                }
                const idx = Math.abs(hash) % mockCategories.length;
                resolve({ pred_class: mockCategories[idx] });
            }, 600);
        });
    }
    
    // 主要预测函数
    async function performPrediction() {
        const rawText = textarea.value.trim();
        if (!rawText) {
            showError("请输入待预测的新闻文本内容");
            return;
        }
        if (rawText.length < 3) {
            showError("文本过短，建议输入至少3个字符以保证分类质量");
            return;
        }
        
        showLoading();
        
        try {
            // 如果不使用mock，调用真实后端API
            if (!USE_MOCK_FALLBACK) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s超时
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({ text: rawText }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    let errorDetail = `HTTP ${response.status}`;
                    try {
                        const errData = await response.json();
                        errorDetail = errData.error || errData.message || errorDetail;
                    } catch(e) {}
                    throw new Error(`服务器响应错误: ${errorDetail}`);
                }
                
                const data = await response.json();
                if (data.pred_class) {
                    showResult(data.pred_class);
                } else if (data.error) {
                    throw new Error(data.error);
                } else {
                    showResult(data.pred_class || "未知分类");
                }
            } else {
                // 可选mock模式（仅供前端视觉调试，不会影响真实集成）
                const mockRes = await mockPredict(rawText);
                showResult(mockRes.pred_class);
                console.warn("⚠️ 当前使用MOCK预测模式，真实分类请部署后端并关闭USE_MOCK_FALLBACK");
            }
        } catch (error) {
            console.error("预测请求失败:", error);
            let friendlyMsg = "";
            if (error.name === 'AbortError') {
                friendlyMsg = "请求超时，后端服务响应过慢，请稍后重试或检查模型状态。";
            } else if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                friendlyMsg = "无法连接到后端服务，请确认Flask服务已启动（默认 http://localhost:5000）且CORS已配置。";
                if (!USE_MOCK_FALLBACK) {
                    friendlyMsg += " 如需预览界面效果可启用mock，但预测非真实结果。";
                }
            } else {
                friendlyMsg = error.message || "未知预测异常";
            }
            showError(friendlyMsg);
        } finally {
            predictBtn.disabled = false;
            predictBtn.innerHTML = `<i class="fas fa-robot"></i> 智能分类预测 <i class="fas fa-arrow-right"></i>`;
        }
    }
    
    // 按钮点击事件
    predictBtn.addEventListener('click', performPrediction);
    
    // 添加快捷示例填充功能
    const exampleChips = document.querySelectorAll('.example-chip');
    exampleChips.forEach(chip => {
        chip.addEventListener('click', () => {
            const sampleText = chip.getAttribute('data-text');
            if (sampleText) {
                textarea.value = sampleText;
                updateCharCount();
                // 可选自动滚动到结果区，不加自动预测，让用户点击按钮
                // 添加一个小提示动画
                textarea.focus();
                const panel = document.getElementById('resultPanel');
                panel.style.transition = '0.2s';
                panel.style.borderColor = '#c084fc';
                setTimeout(() => { panel.style.borderColor = ''; }, 400);
            }
        });
    });
    
    // 支持回车键（Ctrl+Enter 或 Command+Enter）触发预测
    textarea.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            performPrediction();
        }
    });
    
    // 优雅的初始提示：若检测到后端可能没启动，控制台给出提示 (仅在未mock时)
    if (!USE_MOCK_FALLBACK) {
        window.addEventListener('load', () => {
            // 轻量探测后端连通性（不阻塞界面）
            fetch(API_URL, { method: 'OPTIONS', mode: 'cors' })
                .catch(() => console.info("提示: 未检测到后端服务，请确保运行app.py并配置正确的API地址"));
        });
    }
</script>
</body>
</html>
